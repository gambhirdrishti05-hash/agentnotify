name: Test Telegram

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to everyone in TELEGRAM_CHAT_ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          IFS=',' read -ra IDS <<< "$TELEGRAM_CHAT_ID"
          for id in "${IDS[@]}"; do
            trimmed_id=$(echo "$id" | xargs)
            echo "Sending test message to chat_id: $trimmed_id"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${trimmed_id}" \
              -d text="Agent bot test - if you see this, the new bot and secrets are working."
            echo ""
          done
